name: Optional licensed market feed
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Refresh quotes only or quotes and daily history
        options:
          - quotes
          - all
        default: all
  schedule:
    - cron: '17 13-22 * * 1-5'
    - cron: '43 23 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: licensed-market-feed
  cancel-in-progress: false
jobs:
  snapshot:
    # Disabled by default: public redistribution requires a suitable provider license.
    if: vars.ENABLE_MARKET_SYNC == 'true' && vars.MARKET_DATA_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh dated quotations
        run: node scripts/update-market.mjs
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_DATA_PUBLICATION_APPROVED: ${{ vars.MARKET_DATA_PUBLICATION_APPROVED }}
      - name: Refresh extended daily candles at US market close
        if: github.event.schedule == '43 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
        run: node scripts/update-history.mjs
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_DATA_PUBLICATION_APPROVED: ${{ vars.MARKET_DATA_PUBLICATION_APPROVED }}
      - name: Commit validated public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh dated licensed market data'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js icon.svg .nojekyll dist/
          cp -r src data docs vendor dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
