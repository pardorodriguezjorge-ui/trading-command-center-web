document.getElementById('macro').innerHTML=panel('Macroeconomía y tipos',`<p>Indicadores: S&P 500, Nasdaq, VIX, bono EEUU 10 años, EUR/USD y euríbor. La fuente gratuita puede no proporcionar euríbor; en ese caso aparecerá como no disponible.</p><div id="macro-feed" class="entry">Sin actualización automática todavía.</div><p>Fuentes de referencia: <a href="https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html" target="_blank">BCE</a> · <a href="https://www.euribor-rates.eu/en/current-euribor-rates/" target="_blank">Euríbor</a> · <a href="https://www.investing.com/economic-calendar/" target="_blank">Calendario económico</a></p>`);document.getElementById('history').innerHTML=panel('Auditoría local',db.events.length?db.events.map(e=>`<div class="entry"><small>${new Date(e.at).toLocaleString('es-ES')}</small><p>${esc(e.text)}</p></div>`).join(''):'Sin modificaciones registradas');document.getElementById('settings').innerHTML=panel('Datos y actualización',`<label>Régimen de mercado (manual)</label><select id="market"><option>Sin evaluar</option><option>Risk-On</option><option>Neutral</option><option>Risk-Off</option></select><p><button onclick="db.market=document.getElementById('market').value;save('Régimen de mercado actualizado manualmente')">Guardar régimen</button></p><p>Almacenamiento: localStorage de este navegador. No sincroniza Android y PC; borrar datos del navegador puede eliminar el registro. Exporta copias JSON regularmente.</p><p>Para importar un informe horario, utiliza el botón siguiente con JSON estructurado. No hay integración automática con las tareas de ChatGPT.</p><button onclick="document.getElementById('reportImport').click()">Importar informe JSON</button><input hidden type="file" id="reportImport" accept=".json,application/json"><p><small>Esquema de informe: {"reportId":"identificador único","timestamp":"ISO-8601","market":"Neutral","news":[...],"radar":[...],"setups":[...]}. Importa como registros nuevos; no sobrescribe posiciones ni ejecuciones.</small></p><button onclick="exportCSV()">Exportar registro CSV</button>`);document.getElementById('market').value=db.market;document.getElementById('reportImport').onchange=importReport}
function chartPage(){const tickers=[...new Set([...db.positions.map(x=>x.ticker),...db.radar.map(x=>x.ticker)])].filter(x=>/^[A-Z.]{1,10}$/.test(x));return `<div class="note">Gráficas externas de TradingView: requieren internet y pueden mostrar datos diferidos. Los niveles de soporte, resistencia y rango de 52 semanas solo se muestran si están verificados o introducidos manualmente. ATH histórico y máximo de 52 semanas no son lo mismo.</div><div class="chart-grid">${tickers.map(t=>{const p=db.positions.find(x=>x.ticker===t),r=db.radar.find(x=>x.ticker===t);const levels=db.chartLevels?.[t]||{};return `<div class="panel chart-card"><h3>${esc(t)} <a class="chart-link" target="_blank" rel="noopener noreferrer" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(t)}">Abrir gráfica ↗</a></h3><iframe class="chart-frame" loading="lazy" title="Gráfica ${esc(t)}" referrerpolicy="no-referrer" src="https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(t)}&interval=D&theme=light&style=1&locale=es&toolbarbg=f6f7f9&hide_side_toolbar=1&allow_symbol_change=0"></iframe><div class="chart-meta"><span>Soporte: ${esc(levels.support||p?.support||'Pendiente')}</span><span>Resistencia: ${esc(levels.resistance||p?.resistance||'Pendiente')}</span><span>Mín. 52 sem.: ${esc(levels.low52||'Pendiente')}</span><span>Máx. 52 sem.: ${esc(levels.high52||'Pendiente')}</span><span>ATH histórico: ${esc(levels.ath||'Pendiente')}</span></div><p class="chart-warning">${esc(levels.kind||'Niveles sin verificar')} · Fecha: ${esc(levels.asof||'Manual')} · ${levels.source?`<a href="${esc(levels.source)}" target="_blank" rel="noopener">Fuente ↗</a>`:'Fuente manual'}</p><button onclick="editLevels('${t}')">Editar niveles</button><p class="chart-warning">${esc(r?.entry?'Entrada histórica: '+r.entry:'Sin entrada validada')} · Los niveles manuales no se dibujan automáticamente sobre el gráfico.</p></div>`}).join('')}</div>`}function editLevels(t){db.chartLevels??={};const old=db.chartLevels[t]||{};const values={};for(const [k,label] of Object.entries({support:'Soporte',resistance:'Resistencia',low52:'Mínimo 52 semanas',high52:'Máximo 52 semanas',ath:'ATH histórico'})){const v=prompt(`${t} — ${label} (deja vacío si no está verificado)`,old[k]||'');if(v===null)return;values[k]=v.trim()}db.chartLevels[t]=values;save('Niveles de '+t+' actualizados manualmente')};const schemas={positions:['ticker','name','qty','avg','price','stop','tp1','tp2','tp3','support','resistance','plan','catalysts','risks','status'],orders:['ticker','side','qty','limit','status','date'],transactions:['ticker','side','qty','price','date','notes'],radar:['ticker','setup','trend','entry','stop','tp','conviction','status','date','notes'],setups:['ticker','type','aggressive','conservative','confirm','stop','tp1','tp2','tp3','conviction','priority','expiry','cancel','status'],news:['date','ticker','title','url','importance','impact','duration','consequence'],journal:['ticker','detected','type','entry','stop','targets','status','realEntry','realExit','result','reason','max','min','lessons'],rules:['name','version','status','text']};const numeric=new Set(['qty','avg','price','limit','tp1','tp2','tp3']);let editing=null;function edit(collection,id){editing={collection,id};const obj=id?(db[collection]||[]).find(x=>x.id===id):{};document.getElementById('editTitle').textContent=(id?'Editar ':'Añadir ')+collection;document.getElementById('fields').innerHTML=schemas[collection].map(k=>`<div class="${['plan','notes','text','consequence','lessons','confirm'].includes(k)?'wide':''}"><label>${esc(k)}</label>${['plan','notes','text','consequence','lessons','confirm'].includes(k)?`<textarea name="${k}">${esc(obj?.[k])}</textarea>`:`<input name="${k}" ${numeric.has(k)?'type="number" step="any"':'type="text"'} value="${esc(obj?.[k]??'')}">`}</div>`).join('');document.getElementById('editor').showModal()};document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const {collection,id}=editing;const data={id:id||uid()};for(const k of schemas[collection]){const val=e.target.elements[k].value;data[k]=numeric.has(k)?(val===''?null:Number(val)):val}db[collection]??=[];if(id){const idx=db[collection].findIndex(x=>x.id===id);db[collection][idx]=data}else db[collection].push(data);document.getElementById('editor').close();save(`${collection}: ${data.ticker||data.name||data.title||'registro'} ${id?'editado':'añadido'}`)};function filterTable(id,q){document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')};function download(name,contents,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contents],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){download('swing-command-center-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){const rows=[schemas.journal,...db.journal.map(j=>schemas.journal.map(k=>j[k]??''))];download('registro-maestro.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};document.getElementById('import').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x||!Array.isArray(x.positions)||!Array.isArray(x.journal))throw Error('Copia incompatible');if(confirm('¿Reemplazar todos los datos locales con esta copia?')){db=x;save('Copia de seguridad restaurada')}}catch(err){alert('Error al importar: '+err.message)}e.target.value=''};async function importReport(e){try{const x=JSON.parse(await e.target.files[0].text());if(!x.reportId||!x.timestamp)throw Error('Faltan reportId o timestamp');if(db.reports.some(r=>r.reportId===x.reportId))throw Error('Informe ya importado');for(const k of ['news','radar','setups'])if(Array.isArray(x[k]))for(const item of x[k]){if(!item||typeof item!=='object')continue;const obj={...item,id:uid(),sourceReport:x.reportId};db[k].push(obj)}db.reports.push({reportId:x.reportId,timestamp:x.timestamp});if(['Risk-On','Neutral','Risk-Off'].includes(x.market))db.market=x.market;save('Informe importado: '+x.reportId)}catch(err){alert('No se importó: '+err.message)}e.target.value=''};for(const [id,name]of Object.entries(sections)){for(const target of ['side','bottom']){const b=document.createElement('button');b.textContent=name;b.dataset.nav=id;b.onclick=()=>go(id);document.getElementById(target).appendChild(b)}}db.chartLevels??={};for(const [ticker,levels] of Object.entries(VERIFIED_LEVELS)){const current=db.chartLevels[ticker]||{};db.chartLevels[ticker]={...levels,...Object.fromEntries(Object.entries(current).filter(([k,v])=>v&&v!=='Pendiente'&&v!=='Por verificar'))}}render();go('dashboard');loadMarket();setInterval(loadMarket,60000);

async function loadMarket(){try{const response=await fetch('./data/market.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('sin snapshot');const market=await response.json();const q=market.quotes||{};const macro=document.getElementById('macro-feed');if(macro)macro.innerHTML='<small>Última captura: '+esc(market.updated_at||'—')+' · Datos diarios, no tiempo real</small>'+['^GSPC','^IXIC','^VIX','^TNX','EURUSD=X','EURIBOR3MD=X'].map(t=>'<div class="entry">'+esc(t)+': '+(q[t]?fmt(q[t].price)+' ('+esc(q[t].date)+')':'No disponible')+'</div>').join('');const cards=document.querySelectorAll('.chart-card');cards.forEach(card=>{const title=card.querySelector('h3')?.textContent||'';const t=title.split(' ')[0];const v=q[t];if(!v)return;let existing=card.querySelector('.auto-market');if(!existing){existing=document.createElement('div');existing.className='auto-market entry';card.insertBefore(existing,card.querySelector('.chart-meta'))}existing.innerHTML='<strong>Último cierre: '+fmt(v.price)+' · '+esc(v.date)+'</strong><p>Mín. 52 semanas: '+fmt(v.low52)+' · Máx. 52 semanas: '+fmt(v.high52)+'</p><p>Soporte 20 sesiones: '+fmt(v.support20)+' · Resistencia 20 sesiones: '+fmt(v.resistance20)+'</p><small>Niveles automáticos orientativos; no sustituyen los niveles manuales.</small>'});}catch(e){const macro=document.getElementById('macro-feed');if(macro)macro.textContent='Sin datos automáticos: publica el proyecto con GitHub Pages y activa el workflow. Los datos locales siguen disponibles.'}}
</script></body></html>
